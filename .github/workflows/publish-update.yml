name: publish-update

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-update
  cancel-in-progress: false

jobs:
  update-manifest:
    if: vars.ZOTERO_TAG_EDITOR_RELEASE_ENABLED == 'true' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out maintained branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          path: repository
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate release configuration
        shell: bash
        run: node release-source/scripts/verify-release-ready.mjs --repository "${GITHUB_REPOSITORY}"
      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mkdir release-assets
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --pattern 'zotero-tag-editor-*.xpi' \
            --dir release-assets
          VERSION="${TAG#v}"
          node release-source/scripts/verify-release-assets.mjs \
            --xpi "release-assets/zotero-tag-editor-${VERSION}.xpi" \
            --checksum-file release-assets/SHA256SUMS \
            --tag "${TAG}" \
            --source-manifest release-source/addon/manifest.json \
            --output release-assets/manifest.json
      - name: Record the published update
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          node repository/scripts/update-release-manifest.mjs \
            --manifest repository/updates.json \
            --release-manifest release-assets/manifest.json \
            --checksum-file release-assets/SHA256SUMS \
            --tag "${TAG}"
      - name: Commit update metadata
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          cd repository
          if git diff --quiet -- updates.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "release: publish ${TAG} update metadata"
          git push origin HEAD:main
