<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>标签编辑</title>
  <link rel="stylesheet" href="chrome://zotero-tag-editor/content/editor.css" />
</head>
<body>
  <main class="editor" aria-labelledby="editor-title">
    <header class="header">
      <div class="heading">
        <h1 id="editor-title">标签编辑</h1>
        <p id="context" class="subtle"></p>
      </div>
      <button id="close" class="text-button" type="button">关闭</button>
    </header>

    <section class="content">
      <details class="targets">
        <summary id="target-summary"></summary>
        <ul id="target-list"></ul>
      </details>

      <div class="search-row">
        <div class="search-field">
          <input id="search" type="text" role="combobox" aria-label="搜索或创建标签"
            aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions"
            autocomplete="off" placeholder="搜索已有标签，或输入新标签…" maxlength="255" />
        </div>
        <button id="add" class="button" type="button" disabled="disabled">添加</button>
        <div id="suggestions" class="suggestions" role="listbox" aria-label="标签搜索结果" hidden="hidden"></div>
      </div>
      <p id="search-feedback" class="field-feedback" role="status"></p>

      <div class="section-heading">
        <span>所选文献的标签</span>
        <span id="tag-total"></span>
      </div>
      <div id="tags" class="tags"></div>
      <div id="inspector" class="inspector" hidden="hidden"></div>

      <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>

      <div class="tools">
        <button id="undo-step" class="text-button" type="button" disabled="disabled">撤销上一步</button>
        <button id="reset" class="text-button" type="button" disabled="disabled">重置本次编辑</button>
        <span class="spacer"></span>
        <button id="undo-save" class="text-button" type="button" disabled="disabled">撤销上次保存</button>
      </div>

      <div class="settings setting-row">
          <label for="shortcut">呼出快捷键</label>
          <input id="shortcut" type="text" readonly="readonly" autocomplete="off" spellcheck="false" title="点击后直接按下组合键" aria-describedby="shortcut-hint" />
          <button id="save-shortcut" class="button small" type="button">应用</button>
          <span id="shortcut-hint" class="subtle" role="status">点击后按组合键</span>
      </div>
    </section>

    <footer class="footer">
      <div id="message" class="message" role="alert" hidden="hidden"></div>
      <div class="summary">
        <div id="change-summary">尚无修改</div>
        <div id="change-detail" class="subtle">其他标签保持不变</div>
      </div>
      <div class="footer-actions">
        <button id="cancel" class="button" type="button">取消</button>
        <button id="save" class="button primary" type="button" disabled="disabled">保存 <kbd>Ctrl ↵</kbd></button>
      </div>
    </footer>
  </main>
  <script src="chrome://zotero-tag-editor/content/editor.js"></script>
</body>
</html>
